name: Build and Push SPCS Image

on:
  push:
    branches: [main]
    paths:
      - 'spcs-app/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: sfseeurope-colm-uswest.registry.snowflakecomputing.com
      IMAGE: sfseeurope-colm-uswest.registry.snowflakecomputing.com/pepartners_db/core/pe_repo/pe-angular:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snowflake CLI
        run: |
          pip install snowflake-cli-labs
          snow --version

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/connections.toml << 'EOF'
          [aws_uswest]
          account = "SFSEEUROPE-COLM_USWEST"
          user = "ADMIN"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "/tmp/rsa_key.p8"
          warehouse = "COMPUTE_WH"
          role = "ACCOUNTADMIN"
          EOF
          chmod 600 ~/.snowflake/connections.toml
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Login to Snowflake Image Registry
        run: snow spcs image-registry login -c aws_uswest

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t $IMAGE ./spcs-app/

      - name: Push to Snowflake Registry
        run: docker push $IMAGE
