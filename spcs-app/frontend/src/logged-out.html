<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Logged Out - Blackstone-Style Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1a1a2e;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 40px 48px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 16px;
        }
        h1 {
            font-size: 18px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        a.btn {
            display: inline-block;
            background: #1d4ed8;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }
        a.btn:hover { background: #1e40af; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#10003;</div>
        <h1>Logout successful</h1>
        <p>You have been signed out. Redirecting you to the login screen&hellip;</p>
        <a class="btn" href="https://lansdowne-azuk.snowflakecomputing.com/console/logout">Return to login</a>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = "https://lansdowne-azuk.snowflakecomputing.com/console/logout";
        }, 1800);
    </script>
</body>
</html>
