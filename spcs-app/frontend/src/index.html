<!DOCTYPE html>
<html ng-app="peApp">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PE Partners</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css?v=5.2">
    <script src="lib/angular.min.js"></script>
    <script src="lib/angular-route.min.js"></script>
    <script src="lib/chart.umd.min.js"></script>
    <style>[ng\:cloak], [ng-cloak], .ng-cloak { display: none !important; }</style>
</head>
<body ng-cloak>
    <div class="header">
        <h1>PE Partners</h1>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
            <div style="text-align: right;">
                <div style="font-size: 11px; color: #1a1a2e; font-weight: 600;">{{currentUser || 'Loading...'}}</div>
                <div style="font-size: 9px; color: #6c757d;">{{loginTime}}</div>
            </div>
            <button ng-click="logout()" style="padding: 5px 12px; background: #ef4444; color: #fff; border: none; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: 600;">Logout</button>
            <span style="font-size: 11px; color: #6c757d;">v5.2</span>
        </div>
    </div>
    <div class="tabs">
        <div class="tab" ng-class="{active: isActive('/investors')}" ng-click="go('/investors')">Investors</div>
        <div class="tab" ng-class="{active: isActive('/financial')}" ng-click="go('/financial')">Financial</div>
        <div class="tab" ng-class="{active: isActive('/reporting')}" ng-click="go('/reporting')">LP Reporting</div>
        <div class="tab" ng-class="{active: isActive('/search')}" ng-click="go('/search')">Doc Search</div>
        <div class="tab" ng-class="{active: isActive('/call-analytics')}" ng-click="go('/call-analytics')">Call Analytics</div>

        <div class="tab" ng-class="{active: isActive('/schedules')}" ng-click="go('/schedules')">Schedules</div>
        <div class="tab" ng-class="{active: isActive('/agent')}" ng-click="go('/agent')" style="font-weight: 600;">Agent</div>
    </div>
    <div class="content">
        <div ng-view></div>
    </div>
    <script src="app.js?v=4.1"></script>
    <script src="controllers/customerCtrl.js?v=4.1"></script>
    <script src="controllers/financialCtrl.js?v=4.1"></script>
    <script src="controllers/reportingCtrl.js?v=4.1"></script>
    <script src="controllers/searchCtrl.js?v=4.1"></script>
    <script src="controllers/callsCtrl.js?v=4.1"></script>
    <script src="controllers/callAnalyticsCtrl.js?v=4.1"></script>
    <script src="controllers/agentCtrl.js?v=4.1"></script>
    <script src="controllers/schedulesCtrl.js?v=4.1"></script>
</body>
</html>
