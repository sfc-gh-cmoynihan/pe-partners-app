<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b5ea6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" rx="16" fill="#f8f9fc"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Pipeline Flow: Nested Notebooks</text>

  <!-- Node: CUSTOMERS -->
  <rect x="30" y="120" width="180" height="80" rx="12" fill="#ff6b6b" filter="url(#shadow)"/>
  <text x="120" y="155" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">CUSTOMERS</text>
  <text x="120" y="175" text-anchor="middle" font-size="11" fill="#ffe0e0">(raw table - 15 rows)</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="160" x2="290" y2="160" stroke="#5b5ea6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="220" y="135" width="60" height="20" rx="4" fill="#eee8ff"/>
  <text x="250" y="149" text-anchor="middle" font-size="9" fill="#5b5ea6" font-weight="600">NB 01</text>

  <!-- Node: CUSTOMERS_GOLDEN -->
  <rect x="300" y="120" width="200" height="80" rx="12" fill="#ffd93d" filter="url(#shadow)"/>
  <text x="400" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#333">CUSTOMERS_GOLDEN</text>
  <text x="400" y="170" text-anchor="middle" font-size="11" fill="#665500">(deduplicated + GOLDEN_ID)</text>
  <text x="400" y="187" text-anchor="middle" font-size="10" fill="#665500">15 unique records</text>

  <!-- Arrow 2 (to UK) -->
  <line x1="500" y1="140" x2="610" y2="100" stroke="#5b5ea6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="530" y="98" width="60" height="20" rx="4" fill="#eee8ff"/>
  <text x="560" y="112" text-anchor="middle" font-size="9" fill="#5b5ea6" font-weight="600">NB 02</text>

  <!-- Arrow 3 (to Ireland) -->
  <line x1="500" y1="180" x2="610" y2="220" stroke="#5b5ea6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="530" y="195" width="60" height="20" rx="4" fill="#eee8ff"/>
  <text x="560" y="209" text-anchor="middle" font-size="9" fill="#5b5ea6" font-weight="600">NB 03</text>

  <!-- Node: CUSTOMERS_UK -->
  <rect x="620" y="60" width="240" height="80" rx="12" fill="#6bcb77" filter="url(#shadow)"/>
  <text x="740" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">CUSTOMERS_UK</text>
  <text x="740" y="115" text-anchor="middle" font-size="11" fill="#d4ffd9">(view - 3 records)</text>

  <!-- Node: CUSTOMERS_IRELAND -->
  <rect x="620" y="180" width="240" height="80" rx="12" fill="#4d96ff" filter="url(#shadow)"/>
  <text x="740" y="215" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">CUSTOMERS_IRELAND</text>
  <text x="740" y="235" text-anchor="middle" font-size="11" fill="#cce0ff">(materialized view)</text>

  <!-- Legend -->
  <rect x="30" y="270" width="840" height="40" rx="8" fill="#fff" stroke="#e0e0e0"/>
  <circle cx="60" cy="290" r="8" fill="#ff6b6b"/>
  <text x="75" y="294" font-size="10" fill="#666">Raw Source</text>
  <circle cx="180" cy="290" r="8" fill="#ffd93d"/>
  <text x="195" y="294" font-size="10" fill="#666">Golden Source</text>
  <circle cx="320" cy="290" r="8" fill="#6bcb77"/>
  <text x="335" y="294" font-size="10" fill="#666">View</text>
  <circle cx="410" cy="290" r="8" fill="#4d96ff"/>
  <text x="425" y="294" font-size="10" fill="#666">Materialized View</text>
  <rect x="540" y="283" width="40" height="14" rx="3" fill="#eee8ff" stroke="#5b5ea6" stroke-width="0.5"/>
  <text x="600" y="294" font-size="10" fill="#666">Notebook Step</text>
</svg>
