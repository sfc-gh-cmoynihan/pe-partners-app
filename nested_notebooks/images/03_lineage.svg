<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow3" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b5ea6"/>
    </marker>
  </defs>

  <rect width="900" height="350" rx="16" fill="#f8f9fc"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a2e">Lineage Tracking</text>

  <!-- Source node -->
  <rect x="50" y="100" width="180" height="70" rx="12" fill="#ff6b6b" filter="url(#shadow3)"/>
  <text x="140" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">CUSTOMERS</text>
  <text x="140" y="150" text-anchor="middle" font-size="10" fill="#ffe0e0">Source Table</text>

  <!-- Golden node -->
  <rect x="340" y="100" width="220" height="70" rx="12" fill="#ffd93d" filter="url(#shadow3)"/>
  <text x="450" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#333">CUSTOMERS_GOLDEN</text>
  <text x="450" y="150" text-anchor="middle" font-size="10" fill="#665500">Golden Source Table</text>

  <!-- UK node -->
  <rect x="670" y="60" width="190" height="60" rx="12" fill="#6bcb77" filter="url(#shadow3)"/>
  <text x="765" y="87" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">CUSTOMERS_UK</text>
  <text x="765" y="105" text-anchor="middle" font-size="10" fill="#d4ffd9">View</text>

  <!-- Ireland node -->
  <rect x="670" y="150" width="190" height="60" rx="12" fill="#4d96ff" filter="url(#shadow3)"/>
  <text x="765" y="177" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">CUSTOMERS_IRELAND</text>
  <text x="765" y="195" text-anchor="middle" font-size="10" fill="#cce0ff">Materialized View</text>

  <!-- Arrows -->
  <line x1="230" y1="135" x2="340" y2="135" stroke="#5b5ea6" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="560" y1="120" x2="670" y2="90" stroke="#5b5ea6" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <line x1="560" y1="150" x2="670" y2="175" stroke="#5b5ea6" stroke-width="2.5" marker-end="url(#arrow3)"/>

  <!-- Operation labels -->
  <rect x="250" y="115" width="80" height="22" rx="4" fill="#eee8ff" stroke="#5b5ea6" stroke-width="0.5"/>
  <text x="290" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#5b5ea6">CTAS</text>

  <rect x="590" y="87" width="70" height="22" rx="4" fill="#eee8ff" stroke="#5b5ea6" stroke-width="0.5"/>
  <text x="625" y="102" text-anchor="middle" font-size="9" font-weight="600" fill="#5b5ea6">VIEW</text>

  <rect x="590" y="160" width="70" height="22" rx="4" fill="#eee8ff" stroke="#5b5ea6" stroke-width="0.5"/>
  <text x="625" y="175" text-anchor="middle" font-size="9" font-weight="600" fill="#5b5ea6">MATVIEW</text>

  <!-- Lineage Table -->
  <rect x="100" y="230" width="700" height="100" rx="10" fill="#fff" stroke="#e0e0e0" stroke-width="1.5" filter="url(#shadow3)"/>
  <text x="450" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="#333">PIPELINE_LINEAGE</text>

  <!-- Table header -->
  <line x1="120" y1="260" x2="780" y2="260" stroke="#e0e0e0" stroke-width="1"/>
  <text x="145" y="278" font-size="9" font-weight="600" fill="#666">RUN_ID</text>
  <text x="230" y="278" font-size="9" font-weight="600" fill="#666">NOTEBOOK</text>
  <text x="350" y="278" font-size="9" font-weight="600" fill="#666">SOURCE</text>
  <text x="475" y="278" font-size="9" font-weight="600" fill="#666">TARGET</text>
  <text x="590" y="278" font-size="9" font-weight="600" fill="#666">OPERATION</text>
  <text x="690" y="278" font-size="9" font-weight="600" fill="#666">ROWS</text>
  <text x="745" y="278" font-size="9" font-weight="600" fill="#666">STATUS</text>

  <!-- Row 1 -->
  <text x="145" y="296" font-size="9" fill="#333">demo-001</text>
  <text x="230" y="296" font-size="9" fill="#333">01_dedup</text>
  <text x="350" y="296" font-size="9" fill="#333">CUSTOMERS</text>
  <text x="475" y="296" font-size="9" fill="#333">CUSTOMERS_GOLDEN</text>
  <text x="590" y="296" font-size="9" fill="#333">CTAS</text>
  <text x="690" y="296" font-size="9" fill="#333">15</text>
  <rect x="735" y="287" width="45" height="14" rx="3" fill="#d4ffd9"/>
  <text x="757" y="297" text-anchor="middle" font-size="8" fill="#2d8a3e">SUCCESS</text>

  <!-- Row 2 -->
  <text x="145" y="313" font-size="9" fill="#333">demo-001</text>
  <text x="230" y="313" font-size="9" fill="#333">02_uk</text>
  <text x="350" y="313" font-size="9" fill="#333">CUSTOMERS_GOLDEN</text>
  <text x="475" y="313" font-size="9" fill="#333">CUSTOMERS_UK</text>
  <text x="590" y="313" font-size="9" fill="#333">CREATE VIEW</text>
  <text x="690" y="313" font-size="9" fill="#333">3</text>
  <rect x="735" y="304" width="45" height="14" rx="3" fill="#d4ffd9"/>
  <text x="757" y="314" text-anchor="middle" font-size="8" fill="#2d8a3e">SUCCESS</text>
</svg>
